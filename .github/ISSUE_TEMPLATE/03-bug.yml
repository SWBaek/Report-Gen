name: 버그 보고
description: 재현 가능한 오동작이나 회귀를 보고합니다.
title: "[Bug] "
labels:
  - bug
  - needs-triage
projects:
  - SWBaek/4
body:
  - type: markdown
    attributes:
      value: |
        CLI 인증 정보, 토큰, 원문 데이터 등 민감한 정보는 로그와 첨부 파일에서 제거해 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 영역
      description: 문제가 발생한 영역을 선택해 주세요.
      options:
        - Codex CLI Provider
        - GitHub Copilot CLI Provider
        - 공통 Provider 처리
        - Schema 및 검증
        - HTML Renderer
        - Design 및 접근성
        - Tooling
        - Docs
        - 알 수 없음
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Report-Gen 버전 또는 커밋, 사용한 Provider와 관련 버전을 적어 주세요.
      placeholder: |
        - OS:
        - Report-Gen 버전/커밋:
        - Provider 및 CLI 버전:
        - 브라우저:
    validations:
      required: true

  - type: textarea
    id: input_summary
    attributes:
      label: 입력 요약
      description: 민감한 내용을 제외하고 문제를 재현하는 입력 특성을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 반복해서 확인할 수 있는 최소 단계를 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: checkboxes
    id: regression
    attributes:
      label: 회귀 여부
      options:
        - label: 이전 버전 또는 커밋에서는 정상 동작했습니다.

  - type: textarea
    id: logs
    attributes:
      label: 로그와 추가 자료
      description: 민감한 정보를 제거한 로그, 스크린샷 또는 관련 링크를 첨부해 주세요.
      render: shell
    validations:
      required: false
